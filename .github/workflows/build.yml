name: build-exe

on:
  push:
    branches:
      - claude/minecraft-auto-responder-czeo7q
    paths:
      - "main.py"
      - "requirements.txt"
      - "responses.json"
      - "quiz_shared.json"
      - "*.wav"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pynput

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

      - name: Build minecraftotvet.exe
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name minecraftotvet --uac-admin main.py

      - name: Check executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist\minecraftotvet.exe")) {
            Write-Error "minecraftotvet.exe was not created"
            exit 1
          }

          Write-Host "Build successful:"
          Get-Item "dist\minecraftotvet.exe"

      - name: Pack compiled archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-compiled | Out-Null

          Copy-Item "dist\minecraftotvet.exe" "release-compiled\"
          Copy-Item "responses.json" "release-compiled\"
          Copy-Item "quiz_shared.json" "release-compiled\"

          if (Test-Path "*.wav") {
            Copy-Item "*.wav" "release-compiled\"
          }

          Compress-Archive `
            -Path "release-compiled\*" `
            -DestinationPath "minecraftotvet-compiled.zip" `
            -Force

      - name: Pack source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-source | Out-Null

          Copy-Item "main.py" "release-source\"
          Copy-Item "requirements.txt" "release-source\"
          Copy-Item "responses.json" "release-source\"
          Copy-Item "quiz_shared.json" "release-source\"

          if (Test-Path "*.wav") {
            Copy-Item "*.wav" "release-source\"
          }

          Compress-Archive `
            -Path "release-source\*" `
            -DestinationPath "minecraftotvet-source.zip" `
            -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraftotvet-builds
          path: |
            minecraftotvet-compiled.zip
            minecraftotvet-source.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          name: "Последняя сборка"
          body: |
            Автосборка Minecraft Auto Responder.

            minecraftotvet-compiled.zip:
            - minecraftotvet.exe
            - responses.json
            - quiz_shared.json
            - звуковые файлы, если они есть

            minecraftotvet-source.zip:
            - main.py
            - requirements.txt
            - responses.json
            - quiz_shared.json
            - звуковые файлы, если они есть

            Автоматический merge вопросов и ответов выполняется самим main.py.
          files: |
            minecraftotvet-compiled.zip
            minecraftotvet-source.zip
          make_latest: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
